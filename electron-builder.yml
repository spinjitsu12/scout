appId: com.scout.talentsimulator
productName: SCOUT
asar: true
npmRebuild: false
compression: maximum
afterPack: electron/after-pack.cjs
afterAllArtifactBuild: electron/after-artifacts.cjs
toolsets:
  wine: 1.0.1
  nsis: 1.2.1
  winCodeSign: 1.1.0
directories:
  output: release
files:
  - dist/**
  - electron/main.cjs
  - electron/preload.cjs
  - electron/save-store.cjs
  - electron/exit-checkpoint.cjs
  - electron/game-permissions.cjs
  - electron/display-mode.cjs
  - electron/credit-links.cjs
  - electron/desktop-options.cjs
  - electron/mac-updates.cjs
  - electron/game-engine.cjs
  - electron/update-manager.cjs
  - electron/update-worker.ps1
  - electron/update-config.json
  - build/icon.png
  - package.json
  - '!electron/tests/**'
  - '!**/*.map'
win:
  target:
    - target: portable
      arch: [x64]
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  signAndEditExecutable: false
  signExecutable: false
mac:
  compression: normal
  target:
    - target: zip
      arch: [arm64]
  artifactName: SCOUT-${version}-macOS-Apple-Silicon.${ext}
  icon: build/icon.icns
  category: public.app-category.simulation-games
  minimumSystemVersion: '13.0'
  darkModeSupport: true
  identity: '-'
  hardenedRuntime: false
  notarize: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSHighResolutionCapable: true
dmg:
  title: SCOUT
  icon: build/icon.icns
  contents:
    - x: 140
      y: 170
      type: file
    - x: 420
      y: 170
      type: link
      path: /Applications
forceCodeSigning: false
portable:
  requestExecutionLevel: user
  artifactName: SCOUT-${version}-Windows-Portable.${ext}
nsis:
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  artifactName: SCOUT-${version}-Windows-Setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: SCOUT
  deleteAppDataOnUninstall: false
publish: null
